# Local infrastructure for oemintel. Start with: docker compose up -d
# Host ports avoid the defaults (5432, 8080) already used on the dev machine by a native PostgreSQL and the
# Magento stack.
# Ports bind to 127.0.0.1 only: Postgres and MinIO must never be reachable from outside the host.
# Override credentials with a .env file next to this one (never commit it).
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${OEMINTEL_DB_NAME:-oemintel}
      POSTGRES_USER: ${OEMINTEL_DB_USER:-oemintel}
      POSTGRES_PASSWORD: ${OEMINTEL_DB_PASSWORD:-oemintel}
    ports:
      - "127.0.0.1:${OEMINTEL_DB_PORT:-5435}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Not needed until Step 7 (asset pipeline), so it only starts with: docker compose --profile storage up -d
  # The minio/minio image could not be pulled from Docker Hub (access denied); choose the image source in Step 7.
  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OEMINTEL_MINIO_USER:-oemintel}
      MINIO_ROOT_PASSWORD: ${OEMINTEL_MINIO_PASSWORD:-oemintel-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
